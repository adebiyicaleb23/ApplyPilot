name: Run ApplyPilot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  applypilot-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps python-jobspy && pip install pydantic tls-client requests markdownify regex
          pip install applypilot
          python -m playwright install --with-deps chromium

      - name: Configure Profile, Resume, and Searches
        run: |
          mkdir -p ~/.applypilot
          if [ -f profile.json ]; then cp profile.json ~/.applypilot/; fi
          if [ -f resume.txt ]; then cp resume.txt ~/.applypilot/; fi
          if [ -f searches.yaml ]; then cp searches.yaml ~/.applypilot/; fi

      - name: Run ApplyPilot with Qwen Remote Backend
        env:
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          applypilot run --validation lenient
